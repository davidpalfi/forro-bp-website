# Runs the test suite (npm run check) when code changes: on pull requests, and on pushes to
# main that touch anything other than the JSON content and photos. Publishing is done by
# Cloudflare (docs/HOSTING.md), not by GitHub.
name: Check

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'src/content/**'
      - 'public/uploads/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: npm ci
      - run: npm run check
